<!-- ════════════════════════════════════════════════════════════════
     ZITATE SEITE — visuell aufgewertet
     ─────────────────────────────────────────────────────────────────
     Datenformat:
       text       : Zitat-Text (lange werden eingeklappt)
       author     : Autor-Name
       source     : Quellenangabe
       kat        : Kategorie für Filter
       url        : (optional) Link zur frei zugänglichen Quelle
       original   : (optional) Originalsprache (z.B. Griechisch)
       portrait   : (optional) Slug für assets/images/philosophen/<slug>.jpg
       pullquote  : (optional) Hervorgehobener Schlüsselsatz für lange Zitate
       note       : (optional) Persönliche Notiz
     ════════════════════════════════════════════════════════════════ -->

<style>
/* ── Hero ────────────────────────────────────────────────────── */
.zitat-page-hero{padding:4rem 3.5rem 2rem;background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 100%);border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.zitat-page-hero-glow{position:absolute;right:-80px;top:-80px;width:400px;height:400px;background:radial-gradient(circle,var(--glow-accent2) 0%,transparent 70%);pointer-events:none;}
.zitat-page-hero h1{font-family:var(--fh);font-size:3rem;font-weight:800;letter-spacing:-.04em;color:var(--text);margin:.3rem 0;}

.zitat-page-hero p.lead{color:var(--text2);max-width:560px;line-height:1.75;margin-top:.5rem;font-size:.92rem;}

/* ── Zufalls-Showcase oben (groß, mit Porträt) ──────────────── */
.zr-showcase-wrap{padding:2.5rem 3.5rem 1.2rem;}
.zr-showcase{
  position:relative;
  display:grid;
  grid-template-columns:180px 1fr;
  gap:2rem;

  transition:opacity .35s ease, transform .35s ease;
}
.zr-showcase.swap{opacity:0;transform:translateY(8px);}
.zr-showcase::after{
  content:'';position:absolute;right:-50px;top:-50px;

}

.zr-portrait picture{width:100%;height:100%;display:block;}

}
.zr-body{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;}
.zr-label{
  font-family:var(--fm);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;

}
.zr-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}

}
.zr-quote::before{
  content:'\201C';position:absolute;top:-1.8rem;left:-.6rem;

@media(max-width:780px){

/* ── Filter-Leiste ──────────────────────────────────────────── */
.zitat-filter-bar{padding:1.5rem 3.5rem 0;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
.zitat-filter-label{font-family:var(--fm);font-size:.65rem;color:var(--text3);letter-spacing:.12em;text-transform:uppercase;margin-right:.5rem;}
.zitat-filter-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:.35rem .8rem;border-radius:20px;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s;}
@media (hover: hover){ .zitat-filter-btn:hover{border-color:var(--accent);color:var(--accent-text);} }
.zitat-filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.zitat-filter-btn .ct{margin-left:.4rem;opacity:.7;font-size:.66rem;}
.zitat-count{margin-left:auto;font-family:var(--fm);font-size:.72rem;color:var(--text3);letter-spacing:.05em;}

/* ── Karten-Grid ────────────────────────────────────────────── */
.zitat-masonry{columns:2;column-gap:1.5rem;padding:1.5rem 3.5rem 4rem;}
@media(max-width:900px){.zitat-masonry{columns:1;}}

.zitat-card{
  break-inside:avoid;background:var(--bg);

/* Karten-Kopf: Porträt + Autor-Namen schön gestylt */
.zc-head{

  width:42px;height:42px;border-radius:50%;

}
.zc-portrait picture{width:100%;height:100%;display:block;}
.zc-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 20%;}
.zc-portrait-mono{font-family:var(--fh);font-weight:700;color:var(--accent-text);font-size:1.05rem;}

}

.zc-body{padding:1.2rem 1.5rem 1.2rem;position:relative;}
.zc-body::before{
  content:'\201C';position:absolute;top:-.2rem;left:.8rem;
  font-family:var(--fh);font-size:3.5rem;font-weight:800;
  color:var(--accent-text);opacity:.09;line-height:1;pointer-events:none;
}

.zc-text{font-family:var(--fh);font-size:.93rem;line-height:1.72;color:var(--text);white-space:pre-wrap;position:relative;z-index:1;}
.zc-original{
  font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--text2);

}

/* Drop-Cap für lange Zitate */
.zc-text-full > p:first-of-type::first-letter{
  font-family:var(--fh);font-size:3.4rem;font-weight:800;

.zc-pullquote{

  font-family:var(--fh);font-size:1.05rem;font-weight:600;line-height:1.5;

.zitat-card.is-long.is-collapsed .zc-text-full{display:none;}

  color:var(--accent-text);background:var(--surface);

}
@media (hover: hover){ .zc-toggle:hover{background:var(--accent);color:#fff;border-color:var(--accent);} }

<div class="page-hero">
  <div class="page-hero-glow"></div>
  <p class="hero-tag">Gedanken, die bleiben</p>
  <h1 class="page-title">Zitate<span>.</span></h1>
  <p class="page-desc">Sätze, die sich festgesetzt haben. Aus Büchern, Vorlesungen, eigenen Notizen — philosophische, persönliche und analytische Gedanken.</p>
</div>

<!-- ─────────────── ZUFALLSZITAT ─────────────── -->
<div class="zr-showcase-wrap">
  <div class="zr-showcase" id="zr-showcase">
    <button class="zr-reroll" onclick="rerollRandom()" title="Anderes Zitat">⟲</button>
    <div class="zr-portrait" id="zr-portrait">
      <span class="zr-portrait-mono" id="zr-mono">∞</span>
    </div>
    <div class="zr-body" onclick="focusZitatFromRandom()" title="Zum Zitat in der Liste springen">
      <div class="zr-label">Aus der Sammlung</div>
      <div class="zr-quote" id="zr-quote"></div>
      <div class="zr-meta" id="zr-meta"></div>
    </div>
  </div>
</div>

<div class="zitat-ornament">
  <span class="zitat-ornament-line"></span>
  <span class="zitat-ornament-glyph">∴</span>
  <span class="zitat-ornament-line"></span>
</div>

<!-- ─────────────── FILTER + GRID ─────────────── -->
<div class="zitat-filter-bar" id="zitat-filter">
  <span class="zitat-filter-label">Filter:</span>
</div>
<div class="zitat-masonry" id="zitat-grid"></div>

<script>
(function(){
'use strict';

/* Mehrfach-Porträts: nutzt die geteilte Konfiguration window.MULTI_PORTRAITS.
   Wählt zufällig <slug>, <slug>1, <slug>2 … und merkt sich die Wahl. */
window.MULTI_PORTRAITS = window.MULTI_PORTRAITS || {};
const _zChosen = {};
function resolveZSlug(slug){
  const n = window.MULTI_PORTRAITS[slug];
  if (!n || n < 2) return slug;
  if (_zChosen[slug] === undefined){
    const pick = Math.floor(Math.random() * n);
    _zChosen[slug] = pick === 0 ? slug : slug + pick;
  }
  return _zChosen[slug];
}

// ════════════════════════════════════════════════════════════════
// ZITATE
// ════════════════════════════════════════════════════════════════
const ZITATE = window.ZITATE;   // einzige Quelle: siehe window.ZITATE (Pages-Block)

const KAT_ORDER = ['Antike','Metaphysik','Freiheit','(Un-)Endlichkeit','Existenz','Literatur'];
const LONG_THRESHOLD = 280;
let activeKat = 'Alle';

// ────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

function monogram(name){
  // Take first letter of last word ("F. W. J. Schelling" → "S")
  const parts = name.replace(/[.,]/g,'').split(/\s+/).filter(Boolean);
  return parts[parts.length-1].charAt(0).toUpperCase();
}

function portraitTag(z, mono='') {
  const m = mono || monogram(z.author);
  if(z.portrait){
    const base = 'assets/images/philosophen/'+esc(resolveZSlug(z.portrait));
    /* <picture> with avif → webp → jpg fallback chain (browser picks best available) */
    return '<picture>'
      +'<source srcset="'+base+'.avif" type="image/avif">'
      +'<source srcset="'+base+'.webp" type="image/webp">'
      +'<img src="'+base+'.jpg" alt="'+escAttr(z.author)+'" loading="lazy" '
      +'onerror="this.closest(\'picture\').style.display=\'none\';this.closest(\'picture\').nextElementSibling.style.display=\'flex\';">'
      +'</picture>'
      +'<span class="zc-portrait-mono" style="display:none">'+esc(m)+'</span>';
  }
  return '<span class="zc-portrait-mono">'+esc(m)+'</span>';
}

function shortenText(t){
  if(t.length <= LONG_THRESHOLD) return t;
  let cut = t.indexOf(' ', LONG_THRESHOLD);
  if(cut === -1 || cut > LONG_THRESHOLD + 60) cut = LONG_THRESHOLD;
  const slice = t.substring(0, cut);
  const lastPunct = Math.max(slice.lastIndexOf('. '), slice.lastIndexOf('! '), slice.lastIndexOf('? '));
  if(lastPunct > LONG_THRESHOLD - 80) cut = lastPunct + 1;
  return t.substring(0, cut).trim() + ' …';
}

function paragraphsHTML(t){
  return t.split(/\n\n+/).map(p => '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('');
}

// ────────────────────────────────────────────────────────────
// Karten
// ────────────────────────────────────────────────────────────
function buildCard(z, idx){
  const isLong = z.text.length > LONG_THRESHOLD;
  const card = document.createElement('div');
  card.className = 'zitat-card' + (isLong ? ' is-long is-collapsed' : '');
  card.id = 'zitat-' + idx;
  card.setAttribute('data-idx', idx);

  const head = '<div class="zc-head">'
    +'<div class="zc-portrait">'+portraitTag(z)+'</div>'
    +'<div class="zc-author-block">'
      +'<div class="zc-author">'+esc(z.author)+'</div>'
      +'<div class="zc-source">'+esc(z.source.split('—')[0].trim())+'</div>'
    +'</div>'
    +'<span class="zc-kat-tag">'+esc(z.kat)+'</span>'
    +'</div>';

  let body = '<div class="zc-body">';
  if(z.original){
    body += '<div class="zc-original">'+esc(z.original)+'</div>';
    body += '<div class="zc-text">'+esc(z.text)+'</div>';
  } else if(isLong){
    body += '<div class="zc-text zc-text-short">'+esc(shortenText(z.text))+'</div>';
    body += '<div class="zc-text zc-text-full">'+paragraphsHTML(z.text)+'</div>';
    if(z.pullquote){
      body += '<div class="zc-pullquote zc-text-full">„'+esc(z.pullquote)+'"</div>';
    }
    body += '<button class="zc-toggle">Kontext anzeigen ▾</button>';
  } else {
    body += '<div class="zc-text">'+esc(z.text)+'</div>';
    if(z.pullquote){
      body += '<div class="zc-pullquote">„'+esc(z.pullquote)+'"</div>';
    }
  }
  body += '</div>';

  let foot = '';
  if(z.note){
    foot += '<div class="zc-note">'+esc(z.note)+'</div>';
  }

  const sourceFooter = '<div class="zc-foot">'
    + (z.url
        ? '<a class="zc-source-link" href="'+escAttr(z.url)+'" target="_blank" rel="noopener">'+esc(z.source)+' ↗</a>'
        : '<span class="zc-source-full">'+esc(z.source)+'</span>')
    + '</div>';

  card.innerHTML = head + body + foot + sourceFooter;

  if(isLong){
    const btn = card.querySelector('.zc-toggle');
    btn.onclick = function(){
      const exp = card.classList.toggle('is-expanded');
      card.classList.toggle('is-collapsed', !exp);
      btn.textContent = exp ? 'Kontext ausblenden ▴' : 'Kontext anzeigen ▾';
    };
  }
  return card;
}

// ────────────────────────────────────────────────────────────
function buildFilters(){
  const bar = document.getElementById('zitat-filter');
  const counts = {Alle: ZITATE.length};
  ZITATE.forEach(z => { counts[z.kat] = (counts[z.kat]||0)+1; });
  const seen = new Set(['Alle']);
  const ordered = ['Alle'];
  KAT_ORDER.forEach(k => { if(counts[k]) { ordered.push(k); seen.add(k); } });
  Object.keys(counts).sort().forEach(k => { if(!seen.has(k) && k !== 'Alle') ordered.push(k); });

  bar.innerHTML = '';
  const l = document.createElement('span'); l.className='zitat-filter-label'; l.textContent='Filter:';
  bar.appendChild(l);

  ordered.forEach(k => {
    const b = document.createElement('button');
    b.className = 'zitat-filter-btn' + (k===activeKat ? ' active' : '');
    b.innerHTML = k + '<span class="ct">' + counts[k] + '</span>';
    b.onclick = () => { activeKat = k; buildFilters(); renderGrid(); };
    bar.appendChild(b);
  });

  const cnt = document.createElement('span');
  cnt.className = 'zitat-count';
  const showing = activeKat === 'Alle' ? ZITATE.length : counts[activeKat] || 0;
  cnt.textContent = showing + (showing===1 ? ' Zitat' : ' Zitate');
  bar.appendChild(cnt);
}

function renderGrid(){
  const grid = document.getElementById('zitat-grid');
  grid.innerHTML = '';
  const items = activeKat==='Alle' ? ZITATE : ZITATE.filter(z => z.kat===activeKat);
  items.forEach(z => grid.appendChild(buildCard(z, ZITATE.indexOf(z))));
}

// ────────────────────────────────────────────────────────────
// Zufalls-Showcase
// ────────────────────────────────────────────────────────────
let lastRandomIdx = -1;
function pickRandom(){
  if(ZITATE.length < 2) return 0;
  let i;
  do { i = Math.floor(Math.random() * ZITATE.length); } while(i === lastRandomIdx);
  lastRandomIdx = i;
  return i;
}

function renderRandom(){
  const box = document.getElementById('zr-showcase');
  if(!box) return;
  const idx = pickRandom();
  const z = ZITATE[idx];
  box.setAttribute('data-current-idx', idx);
  const display = z.pullquote || (z.text.length > 240 ? shortenText(z.text).slice(0,240) + '…' : z.text);

  box.classList.add('swap');
  setTimeout(() => {
    /* Erneut prüfen: renderRandom() sichert oben zwar `box` ab, aber zwischen
       dem Aufruf und diesem Rückruf können 260 ms vergehen — genug, um die
       Seite zu wechseln. Dann ist zr-portrait aus dem DOM und die Zuweisung
       lief auf null. Das war die Ursache des TypeError beim schnellen
       Durchklicken; bei gemächlicher Bedienung trat er nie auf. */
    const portraitEl = document.getElementById('zr-portrait');
    if(!portraitEl || !document.getElementById('zr-showcase')) return;
    portraitEl.innerHTML = '';
    if(z.portrait){
      const base = 'assets/images/philosophen/'+resolveZSlug(z.portrait);
      const pic = document.createElement('picture');
      const s1 = document.createElement('source'); s1.srcset = base+'.avif'; s1.type = 'image/avif';
      const s2 = document.createElement('source'); s2.srcset = base+'.webp'; s2.type = 'image/webp';
      const img = document.createElement('img');
      img.src = base+'.jpg'; img.alt = z.author;
      img.onerror = function(){
        portraitEl.innerHTML = '<span class="zr-portrait-mono">'+esc(monogram(z.author))+'</span>';
      };
      pic.appendChild(s1); pic.appendChild(s2); pic.appendChild(img);
      portraitEl.appendChild(pic);
    } else {
      portraitEl.innerHTML = '<span class="zr-portrait-mono">'+esc(monogram(z.author))+'</span>';
    }
    document.getElementById('zr-quote').textContent = '„'+display+'"';
    document.getElementById('zr-meta').innerHTML =
      '<span class="zr-author">'+esc(z.author)+'</span> · '+esc(z.source);
    box.classList.remove('swap');
  }, 220);
}


window.focusZitatFromRandom = function(){
  const box = document.getElementById('zr-showcase');
  if(!box) return;
  const idx = box.getAttribute('data-current-idx');
  if(idx === null) return;
  if(activeKat !== 'Alle'){
    activeKat = 'Alle';
    buildFilters();
    renderGrid();
  }
  setTimeout(function(){
    const card = document.getElementById('zitat-' + idx);
    if(!card) return;
    card.scrollIntoView({behavior:'smooth', block:'center'});
    card.classList.add('zitat-card-highlight');
    if(card.classList.contains('is-long')){
      card.classList.remove('is-collapsed');
      card.classList.add('is-expanded');
      const btn = card.querySelector('.zc-toggle');
      if(btn) btn.textContent = 'Kontext ausblenden ▴';
    }
    setTimeout(function(){ card.classList.remove('zitat-card-highlight'); }, 2500);
  }, 50);
};
window.rerollRandom = renderRandom;
window.renderZitate = function(){ buildFilters(); renderGrid(); renderRandom(); };

buildFilters();
renderGrid();
renderRandom();

})();
</script>
